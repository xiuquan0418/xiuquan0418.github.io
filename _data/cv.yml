## Research Areas

### RNA Velocity and Cellular Dynamics

Development of mathematical and computational methods for evaluating
RNA velocity embeddings and studying cellular state transitions.

### Nanopore Sequencing and Machine Learning

Machine-learning approaches for extracting biological information
from nanopore long-read sequencing data, including DNA methylation
detection.

### Large-Scale Biological Network Analysis

Graph-based and topological approaches for investigating complex
biological networks and single-cell transcriptomic datasets.

### Biomedical Artificial Intelligence

Machine-learning approaches for biomedical datasets, including EEG
analysis and computational studies of neurological conditions.

