Dr. Wang leads research in mathematical and computational approaches
for analyzing high-dimensional biological data. His research includes
RNA velocity and single-cell transcriptomics, nanopore long-read
sequencing, network analysis, and biomedical machine learning.

His research program is supported by projects including the NSF
HBCU-UP Research Initiation Award, NSF HBCU-UP Implementation Project,
and MS-INBRE Project Development Grant.

